type Department @table {
  deptCd: String! @col(dataType: "varchar(30)") @unique
  deptNm: String! @col(dataType: "varchar(120)")
  parentDeptCd: String @col(dataType: "varchar(30)")
  sortOrder: Int
  activeYn: Boolean
}

type UserProfile @table {
  firebaseUid: String! @col(dataType: "varchar(128)") @unique
  userId: String! @col(dataType: "varchar(50)") @unique
  userNm: String! @col(dataType: "varchar(120)")
  userEmail: String @col(dataType: "varchar(255)")
  deptCd: String @col(dataType: "varchar(30)")
  dept: Department @ref(fields: ["deptCd"], references: ["deptCd"])
  jbgdNm: String @col(dataType: "varchar(80)")
  userRole: String @col(dataType: "varchar(30)")
  workSttsCd: String @col(dataType: "varchar(20)")
  extTel: String @col(dataType: "varchar(30)")
  hireYmd: Date
}

type ApprovalTemplate @table {
  templateCode: String! @col(dataType: "varchar(40)") @unique
  templateName: String! @col(dataType: "varchar(160)")
  categoryCode: String @col(dataType: "varchar(30)")
  activeYn: Boolean
}

type ApprovalDocument @table {
  docNo: String! @col(dataType: "varchar(40)") @unique
  title: String! @col(dataType: "varchar(255)")
  statusCd: String! @col(dataType: "varchar(30)")
  templateCode: String @col(dataType: "varchar(40)")
  template: ApprovalTemplate @ref(fields: ["templateCode"], references: ["templateCode"])
  drafterUid: String @col(dataType: "varchar(128)")
  drafter: UserProfile @ref(fields: ["drafterUid"], references: ["firebaseUid"])
  draftedAt: Timestamp
  submittedAt: Timestamp
}

type BoardPost @table {
  postNo: String! @col(dataType: "varchar(40)") @unique
  title: String! @col(dataType: "varchar(255)")
  categoryCd: String @col(dataType: "varchar(30)")
  statusCd: String @col(dataType: "varchar(30)")
  authorUid: String @col(dataType: "varchar(128)")
  author: UserProfile @ref(fields: ["authorUid"], references: ["firebaseUid"])
  createdAt: Timestamp
  updatedAt: Timestamp
}

type Project @table {
  projectNo: String! @col(dataType: "varchar(40)") @unique
  projectName: String! @col(dataType: "varchar(200)")
  statusCd: String @col(dataType: "varchar(30)")
  ownerUid: String @col(dataType: "varchar(128)")
  owner: UserProfile @ref(fields: ["ownerUid"], references: ["firebaseUid"])
  startedAt: Date
  endedAt: Date
}

type ProjectTask @table {
  taskNo: String! @col(dataType: "varchar(40)") @unique
  title: String! @col(dataType: "varchar(200)")
  projectNo: String @col(dataType: "varchar(40)")
  project: Project @ref(fields: ["projectNo"], references: ["projectNo"])
  assigneeUid: String @col(dataType: "varchar(128)")
  assignee: UserProfile @ref(fields: ["assigneeUid"], references: ["firebaseUid"])
  statusCd: String @col(dataType: "varchar(30)")
  dueDate: Date
}

type ContractTemplate @table {
  templateNo: String! @col(dataType: "varchar(40)") @unique
  templateName: String! @col(dataType: "varchar(160)")
  statusCd: String @col(dataType: "varchar(30)")
  ownerUid: String @col(dataType: "varchar(128)")
  owner: UserProfile @ref(fields: ["ownerUid"], references: ["firebaseUid"])
  updatedAt: Timestamp
}
